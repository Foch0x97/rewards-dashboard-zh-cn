name: Sync upstream safely
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upstream-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge upstream without publishing changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mgrimace/rewards-dashboard.git
          git fetch upstream main
          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort
            echo '上游合并有冲突，已停止。main 和已发布版本均未改变。' >&2
            exit 1
          fi
          node scripts/install-locale.mjs
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - name: Verify merged image
        run: docker build -t rewards-dashboard-zh-cn:sync-check ./rewards-dashboard
      - name: Commit only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git add rewards-dashboard/public/index.html
          if test -f .git/MERGE_HEAD; then
            git commit -m 'chore: merge upstream and retain Chinese language support'
          elif ! git diff --cached --quiet; then
            git commit -m 'chore: restore Chinese language entry after upstream sync'
          fi
          # 普通推送；远端有新提交就拒绝，不强推，不丢弃中文修改。
          git push origin HEAD:main
